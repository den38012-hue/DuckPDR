name: Build and deploy DuckPDR to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate static pages
        run: node build.js

      - name: Verify generated site
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/bilet/1/index.html
          test -f _site/tema/33/index.html
          test -f _site/sitemap.xml
          test -f _site/robots.txt
          test -f _site/CNAME
          test -f _site/googlebd5bc69959f476cd.html
          test -d _site/images
          echo "Generated site verified."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
