name: Deploy DuckPDR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        shell: bash
        run: |
          set -e

          rm -rf _site
          mkdir -p _site

          # Main website files
          cp index.html _site/
          cp app.js _site/
          cp data.js _site/
          cp style.css _site/

          # Custom domain
          cp CNAME _site/

          # All question and mascot images
          cp -R images _site/images

          echo "Website files:"
          find _site -maxdepth 2 -type f | sort

          echo
          echo "Image files:"
          find _site/images -type f | wc -l

          # Basic deployment checks
          test -f "_site/index.html"
          test -f "_site/app.js"
          test -f "_site/data.js"
          test -f "_site/style.css"
          test -f "_site/CNAME"
          test -d "_site/images"

          IMAGE_COUNT=$(find _site/images -type f | wc -l)
          if [ "$IMAGE_COUNT" -eq 0 ]; then
            echo "ERROR: images directory is empty."
            exit 1
          fi

          echo
          echo "Deployment package is ready."
          echo "Images found: $IMAGE_COUNT"

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
