name: Deploy DuckPDR to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          cp index.html app.js data.js style.css CNAME robots.txt sitemap.xml _site/
          cp -R images _site/images

          # Keep Google's HTML verification file published when present.
          for file in google*.html; do
            [ -f "$file" ] || continue
            cp "$file" _site/
            echo "Included verification file: $file"
          done

          test -f _site/index.html
          test -f _site/app.js
          test -f _site/data.js
          test -f _site/style.css
          test -f _site/CNAME
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -d _site/images
          test "$(find _site/images -type f | wc -l)" -gt 0

          echo "Website package prepared successfully."

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
